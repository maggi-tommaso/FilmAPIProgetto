<header class="border-b border-slate-200 bg-white">
  <div class="mx-auto max-w-7xl px-4 py-4 lg:px-8">
    <div class="grid grid-cols-[1fr_auto] items-center gap-3 md:grid-cols-[minmax(180px,1fr)_auto_minmax(180px,1fr)]">
      <a href="/index.html" class="text-2xl font-black tracking-tight text-slate-900">Sala Luce</a>

      <nav class="hidden items-center justify-center gap-5 text-sm font-semibold uppercase tracking-wide text-slate-600 md:flex">
        <a href="/index.html" data-nav="index">Home</a>
        <a href="/films.html" data-nav="films">Film</a>
        <a href="/registi.html" data-nav="registi">Registi</a>
        <a href="/cinemas.html" data-nav="cinemas">Cinema</a>
        <a href="/proiezioni.html" data-nav="proiezioni">Programmazione</a>
        <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
      </nav>

      <div class="flex items-center justify-end gap-2">
        <div class="hidden md:block" data-auth-desktop></div>
        <button
          type="button"
          class="rounded border border-slate-300 px-3 py-2 text-sm text-slate-700 md:hidden"
          data-nav-toggle
          aria-label="Apri menu"
        >
          Menu
        </button>
      </div>
    </div>

    <div class="mt-3 md:hidden" data-auth-mobile></div>
  </div>

  <nav class="hidden border-t border-slate-200 px-4 py-3 md:hidden" data-nav-menu-mobile>
    <div class="flex flex-col gap-3 text-sm font-semibold uppercase tracking-wide text-slate-700">
      <a href="/index.html" data-nav="index">Home</a>
      <a href="/films.html" data-nav="films">Film</a>
      <a href="/registi.html" data-nav="registi">Registi</a>
      <a href="/cinemas.html" data-nav="cinemas">Cinema</a>
      <a href="/proiezioni.html" data-nav="proiezioni">Programmazione</a>
      <a href="/dashboard.html" data-nav="dashboard">Dashboard</a>
    </div>
  </nav>

  <div class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-900/60 p-4" data-auth-modal>
    <div class="w-full max-w-md rounded-2xl border border-slate-200 bg-white p-6 shadow-xl">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 class="text-2xl font-black text-slate-900">Accedi</h2>
          <p class="mt-1 text-sm text-slate-600">Inserisci username o email, insieme alla password.</p>
        </div>
        <button type="button" class="rounded border border-slate-300 px-2 py-1 text-xs font-semibold uppercase" data-auth-close>Chiudi</button>
      </div>

      <form class="mt-5 space-y-3" data-login-form>
        <label class="block text-sm font-semibold text-slate-700">
          Username o email
          <input required type="text" name="identifier" class="mt-1 w-full rounded border border-slate-300 px-3 py-2" placeholder="admin oppure admin@salaluce.local" />
        </label>
        <label class="block text-sm font-semibold text-slate-700">
          Password
          <input required type="password" name="password" class="mt-1 w-full rounded border border-slate-300 px-3 py-2" placeholder="********" />
        </label>
        <button class="w-full rounded bg-slate-900 px-4 py-2 text-sm font-bold text-white" type="submit">Accedi</button>
      </form>

      <p class="mt-4 text-center text-sm text-slate-600">
        <a href="/register.html" class="font-semibold text-primary hover:underline">Non hai un account? Registrati</a>
      </p>

      <div class="my-4 flex items-center gap-3">
        <span class="h-px flex-1 bg-slate-200"></span>
        <span class="text-xs font-semibold uppercase tracking-wide text-slate-500">Oppure</span>
        <span class="h-px flex-1 bg-slate-200"></span>
      </div>

      <div class="space-y-2">
        <div data-google-button class="flex justify-center"></div>
        <p class="text-center text-xs text-slate-500" data-google-status></p>
      </div>

      <p class="mt-3 text-xs text-slate-500" data-auth-feedback></p>
    </div>
  </div>
</header>
