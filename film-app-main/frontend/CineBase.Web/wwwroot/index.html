<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCurtain — Il tuo cinema, sempre</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans">
  <div id="navbar-container"></div>

  <!-- Hero Section -->
  <section class="relative min-h-[580px] sm:min-h-[540px] lg:h-[65vh] lg:min-h-[520px] flex items-center py-12 lg:py-0 overflow-hidden">
    <div class="hero-overlay absolute inset-0 z-10"></div>
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=1920')] bg-cover bg-center"></div>
    <!-- Subtle red-tinted gradient overlay -->
    <div class="absolute inset-0 bg-gradient-to-br from-brand-red/20 via-transparent to-brand-surface/80 z-[5]"></div>

    <div class="relative z-20 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full">
      <div class="max-w-2xl animate-fade-in">
        <img src="/assets/images/logo-full.png" alt="RedCurtain" class="h-14 sm:h-16 lg:h-20 w-auto mb-4 drop-shadow-xl" loading="eager">
        <div class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/10 backdrop-blur-md border border-white/10 mb-6">
          <span class="w-2 h-2 rounded-full bg-brand-red animate-pulse"></span>
          <span class="text-white/80 text-xs font-medium tracking-wide uppercase">Prenota il tuo prossimo film</span>
        </div>
        <h1 class="hero-section-text text-4xl sm:text-5xl lg:text-6xl xl:text-7xl font-extrabold mb-6 leading-[1.05] tracking-tight">
          Il cinema <br class="hidden sm:block"><span class="hero-section-text-accent">a portata di mano</span>
        </h1>
        <p class="hero-section-text text-base sm:text-lg lg:text-xl mb-8 leading-relaxed max-w-xl opacity-85">
          Scegli il tuo cinema, esplora la programmazione e acquista i biglietti in pochi secondi. Tutto in un'unica piattaforma.
        </p>
        <div class="flex flex-wrap gap-3">
          <a href="/programmazione.html" class="btn-gold-lg !text-base hero-cta-glow">
            <i class="fa-solid fa-film"></i>Vai alla Programmazione
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Film in Evidenza -->
  <section id="featured" class="py-20 lg:py-24">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-col sm:flex-row sm:items-end gap-4 mb-12">
        <div class="flex-1">
          <p class="text-brand-red-light text-sm font-semibold uppercase tracking-widest mb-2">In evidenza</p>
          <h2 class="text-3xl sm:text-4xl font-bold text-brand-on-surface tracking-tight">Questa settimana</h2>
        </div>
        <a href="/programmazione.html" class="btn-outline-brand !rounded-full">
          <i class="fa-solid fa-calendar-days mr-2"></i>Programmazione Completa
        </a>
      </div>

      <div id="featured-grid" class="grid grid-cols-1 lg:grid-cols-3 gap-6 lg:gap-5">
        <div class="lg:col-span-3 text-center py-16 text-brand-on-surface-variant">
          <i class="fa-solid fa-film text-5xl mb-4 block opacity-30"></i>
          <p class="text-lg">Caricamento film in evidenza...</p>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/pages/home.js"></script>
</body>

</html>
