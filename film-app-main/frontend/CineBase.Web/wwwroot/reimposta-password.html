<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Reimposta Password</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>
  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="/index.html" class="text-3xl font-bold text-brand-gold tracking-tight inline-flex items-center gap-2">
          <span class="text-4xl">🎬</span>CineBase
        </a>
      </div>
      <div class="glass-panel card-elevated p-8 rounded-2xl">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-brand-on-surface mb-2">Reimposta Password</h1>
          <p class="text-brand-on-surface-variant text-sm">Scegli una nuova password per il tuo account.</p>
        </div>
        <div id="success-alert" class="hidden bg-green-900/20 border border-green-500/30 text-green-400 px-4 py-3 rounded-xl mb-6 text-sm">
          <i class="fa-solid fa-check-circle mr-2"></i>
          <span>Password reimpostata con successo! Verrai reindirizzato...</span>
        </div>
        <div id="error-alert" class="hidden bg-brand-error-container border border-brand-error/30 text-brand-error px-4 py-3 rounded-xl mb-6 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i><span id="error-message"></span>
        </div>
        <form id="reset-form" class="space-y-5">
          <div>
            <label for="password" class="block text-sm font-medium text-brand-on-surface mb-2">Nuova Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" class="ghost-input w-full px-4 py-3 pr-12 rounded-xl" placeholder="Min. 8 caratteri, almeno una maiuscola e un numero" required minlength="8" autocomplete="new-password">
              <button type="button" id="toggle-password" title="Mostra o nascondi password" class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant hover:text-brand-on-surface">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" id="submit-btn" class="btn-gold w-full py-3 text-base font-semibold rounded-xl">
            <span id="btn-text">Reimposta Password</span>
            <span id="btn-loader" class="hidden"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Reimpostazione...</span>
          </button>
        </form>
        <div class="text-center mt-6">
          <a href="/login.html" class="text-brand-on-surface-variant hover:text-brand-gold text-sm inline-flex items-center gap-1">
            <i class="fa-solid fa-arrow-left text-xs"></i>Torna al login
          </a>
        </div>
      </div>
    </div>
  </div>
  <div id="footer-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        window.location.href = '/login.html';
        return;
      }

      const form = document.getElementById('reset-form');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnLoader = document.getElementById('btn-loader');
      const successAlert = document.getElementById('success-alert');
      const errorAlert = document.getElementById('error-alert');
      const errorMessage = document.getElementById('error-message');
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');

      toggleBtn.addEventListener('click', () => {
        const type = passwordInput.type === 'password' ? 'text' : 'password';
        passwordInput.type = type;
        toggleBtn.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const password = passwordInput.value;
        if (password.length < 8 || !/[A-Z]/.test(password) || !/[a-z]/.test(password) || !/[0-9]/.test(password)) {
          errorMessage.textContent = 'Password non valida: min. 8 caratteri, almeno una maiuscola e un numero.';
          errorAlert.classList.remove('hidden');
          return;
        }

        btnText.classList.add('hidden');
        btnLoader.classList.remove('hidden');
        submitBtn.disabled = true;
        errorAlert.classList.add('hidden');

        try {
          const deviceId = Auth.getOrCreateDeviceId();
          const r = await fetch(`${API_BASE_URL}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword: password, deviceId })
          });
          if (!r.ok) {
            const err = await r.json().catch(() => ({}));
            throw new Error(err.message || 'Token non valido o scaduto.');
          }
          const data = await r.json();
          Auth.saveTokens(data.accessToken, data.refreshToken);
          Auth.saveUser(data.user);
          successAlert.classList.remove('hidden');
          form.classList.add('hidden');
          setTimeout(() => { window.location.href = '/index.html'; }, 2000);
        } catch (err) {
          errorMessage.textContent = err.message || 'Errore durante il reset.';
          errorAlert.classList.remove('hidden');
        } finally {
          btnText.classList.remove('hidden');
          btnLoader.classList.add('hidden');
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
