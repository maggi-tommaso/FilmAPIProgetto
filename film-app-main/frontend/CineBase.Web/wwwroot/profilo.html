<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCurtain â€” Il Mio Profilo</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans">
  <div id="navbar-container"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-brand-on-surface tracking-tight">Il Mio Profilo</h1>
      <p class="text-sm text-brand-on-surface-variant mt-1">Gestisci i tuoi dati, biglietti, ordini e credito</p>
    </div>

    <!-- NOTIFICHE - DEBUG -->
    <div id="sezione-notifiche" style="display:block !important; visibility:visible !important; opacity:1 !important; background:#1a1a2e; border:3px solid #e94560; padding:20px; margin-bottom:20px; border-radius:12px; color:white;">
      <h2 style="color:#e94560; font-size:22px; margin-bottom:12px;">
        <i class="fa-solid fa-bell" style="color:#e94560;"></i> NOTIFICHE
        <span id="notifiche-badge" style="display:none; background:red; color:white; padding:2px 8px; border-radius:50%; margin-left:8px; font-size:12px;">0</span>
      </h2>
      <div id="notifiche-content">
        <p style="color:#aaa;">Caricamento notifiche...</p>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Dati Personali -->
      <div class="card-elevated p-6 border border-transparent hover:border-brand-red/50 transition-all duration-200">
        <h2 class="text-xl font-bold text-brand-on-surface tracking-tight mb-6">
          <i class="fa-solid fa-user text-brand-red mr-2"></i>Dati Personali
        </h2>
        <form id="profilo-form" class="space-y-4">
          <div>
            <label for="profilo-email" class="block text-sm font-medium text-brand-on-surface mb-1">Email</label>
            <input type="email" id="profilo-email"
              class="ghost-input w-full px-4 py-2 bg-brand-surface-container/50 cursor-not-allowed" readonly
              aria-readonly="true">
          </div>
          <div>
            <label for="profilo-nome" class="block text-sm font-medium text-brand-on-surface mb-1">Nome</label>
            <input type="text" id="profilo-nome" class="ghost-input w-full px-4 py-2" required maxlength="100">
          </div>
          <div>
            <label for="profilo-cognome" class="block text-sm font-medium text-brand-on-surface mb-1">Cognome</label>
            <input type="text" id="profilo-cognome" class="ghost-input w-full px-4 py-2" required maxlength="100">
          </div>
          <div>
            <label for="profilo-telefono" class="block text-sm font-medium text-brand-on-surface mb-1">Telefono</label>
            <input type="tel" id="profilo-telefono" class="ghost-input w-full px-4 py-2" maxlength="20"
              placeholder="Opzionale">
          </div>
          <div>
            <label for="profilo-cinema" class="block text-sm font-medium text-brand-on-surface mb-1">Cinema preferito</label>
            <select id="profilo-cinema" class="ghost-input w-full px-4 py-2 rounded-xl">
              <option value="">Nessuna preferenza</option>
            </select>
          </div>
          <div class="flex items-center gap-4 pt-2">
            <button type="submit" class="btn-gold px-6 py-2">
              <i class="fa-solid fa-floppy-disk mr-2"></i>Salva Modifiche
            </button>
            <span id="profilo-saved" class="hidden text-emerald-500 text-sm">
              <i class="fa-solid fa-check mr-1"></i>Salvato
            </span>
          </div>
        </form>
      </div>

      <!-- Credito + Sicurezza -->
      <div class="space-y-8">
        <!-- Sicurezza Account -->
        <div class="card-elevated p-6 border border-transparent hover:border-brand-red/50 transition-all duration-200">
          <h2 class="text-xl font-bold text-brand-on-surface tracking-tight mb-4">
            <i class="fa-solid fa-shield-halved text-brand-red mr-2"></i>Sicurezza Account
          </h2>
          <div id="security-content">
            <div class="text-center py-4 text-brand-on-surface-variant">
              <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
              <p class="text-sm">Caricamento...</p>
            </div>
          </div>
        </div>

        <!-- Credito -->
        <div class="card-elevated p-6 border border-transparent hover:border-brand-red/50 transition-all duration-200">
          <h2 class="text-xl font-bold text-brand-on-surface tracking-tight mb-4">
            <i class="fa-solid fa-wallet text-brand-red mr-2"></i>Credito Piattaforma
          </h2>
          <div id="credito-content">
            <div class="text-center py-4 text-brand-on-surface-variant">
              <i class="fa-solid fa-spinner fa-spin text-xl mb-2"></i>
              <p class="text-sm">Caricamento...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Ordini -->
    <div class="mt-8 card-elevated p-6 border border-transparent hover:border-brand-red/50 transition-all duration-200">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-brand-on-surface tracking-tight">
          <i class="fa-solid fa-receipt text-brand-red mr-2"></i>I Miei Ordini
        </h2>
      </div>
      <div id="ordini-list">
        <div class="text-center py-8 text-brand-on-surface-variant">
          <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
          <p>Caricamento ordini...</p>
        </div>
      </div>
    </div>

    <!-- Biglietti -->
    <div class="mt-8 card-elevated p-6 border border-transparent hover:border-brand-red/50 transition-all duration-200">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-brand-on-surface tracking-tight">
          <i class="fa-solid fa-ticket text-brand-red mr-2"></i>I Miei Biglietti
        </h2>
      </div>
      <div id="biglietti-list">
        <div class="text-center py-8 text-brand-on-surface-variant">
          <i class="fa-solid fa-spinner fa-spin text-3xl mb-3"></i>
          <p>Caricamento biglietti...</p>
        </div>
      </div>
    </div>

  </main>

  <div id="footer-container"></div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/pages/profilo.js"></script>
</body>

</html>
