<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCurtain â€” I Nostri Cinema</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans">
  <div id="navbar-container"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Loading State -->
    <div id="loading-state" class="text-center py-16">
      <i class="fa-solid fa-spinner fa-spin text-5xl mb-4 block text-brand-red opacity-40"></i>
      <p class="text-brand-on-surface-variant text-lg">Caricamento...</p>
    </div>

    <!-- Error State -->
    <div id="error-state" class="hidden text-center py-16">
      <i class="fa-solid fa-circle-exclamation text-6xl text-brand-error mb-4 block opacity-50"></i>
      <h3 class="text-xl font-semibold text-brand-on-surface mb-2">Errore caricamento</h3>
      <p class="text-brand-on-surface-variant mb-6" id="error-message">Impossibile caricare i dati</p>
      <button onclick="window.history.back()" class="btn-outline-brand !rounded-full">
        <i class="fa-solid fa-arrow-left mr-1.5"></i>Torna indietro
      </button>
    </div>

    <!-- Cinema List View -->
    <div id="cinema-list-view" class="hidden animate-fade-in">
      <div class="mb-8">
        <p class="text-brand-red-light text-sm font-semibold uppercase tracking-widest mb-2">La nostra rete</p>
        <h1 class="text-3xl md:text-4xl font-bold text-brand-on-surface tracking-tight">I Nostri Cinema</h1>
      </div>

      <div id="cinemas-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      </div>

      <div id="no-cinemas-state" class="hidden text-center py-16">
        <i class="fa-solid fa-film text-6xl text-brand-on-surface-variant mb-4 block opacity-25"></i>
        <h3 class="text-xl font-semibold text-brand-on-surface mb-2">Nessun cinema disponibile</h3>
        <p class="text-brand-on-surface-variant">Al momento non ci sono cinema nella rete</p>
      </div>
    </div>

    <!-- Cinema Detail View -->
    <div id="cinema-detail-view" class="hidden animate-fade-in">
      <!-- Cinema Header -->
      <div class="card-elevated p-6 mb-8">
        <div class="flex items-start gap-4">
          <div class="w-12 h-12 rounded-xl bg-brand-red/10 flex items-center justify-center flex-shrink-0">
            <i class="fa-solid fa-film text-brand-red text-xl"></i>
          </div>
          <div class="flex-1">
            <h1 id="cinema-name" class="text-2xl md:text-3xl font-bold text-brand-on-surface mb-1"></h1>
            <p id="cinema-address" class="text-brand-on-surface-variant flex items-center gap-1.5">
              <i class="fa-solid fa-location-dot text-brand-red text-sm"></i><span></span>
            </p>
            <div id="cinema-tipologie" class="flex flex-wrap gap-2 mt-3"></div>
          </div>
          <button onclick="goToCinemaList()" class="btn-outline-brand text-sm !rounded-full !px-5 flex-shrink-0">
            <i class="fa-solid fa-arrow-left mr-1.5"></i>Torna alla lista
          </button>
        </div>
      </div>

      <!-- Date Rail -->
      <div id="date-rail-container" class="mb-8"></div>

      <!-- Films Schedule -->
      <div id="films-schedule" class="space-y-4">
      </div>

      <!-- No Shows State -->
      <div id="no-shows-state" class="hidden text-center py-16">
        <i class="fa-solid fa-film text-6xl text-brand-on-surface-variant mb-4 block opacity-25"></i>
        <h3 class="text-xl font-semibold text-brand-on-surface mb-2">Nessuno show disponibile</h3>
        <p class="text-brand-on-surface-variant">Non ci sono spettacoli per la data selezionata</p>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/date-rail.js"></script>
  <script src="/js/pages/my-cinemas.js"></script>
</body>

</html>
