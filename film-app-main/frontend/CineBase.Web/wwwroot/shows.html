<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCurtain â€” Gestione Show</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans">
  <div id="navbar-container"></div>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 animate-fade-in">
    <!-- Page Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between mb-8">
      <div>
        <h1 class="text-2xl font-bold text-brand-on-surface">Gestione Show</h1>
        <p class="text-sm text-brand-on-surface-variant mt-1">Gestisci gli spettacoli multi-sala</p>
      </div>
      <div class="mt-4 md:mt-0">
        <button onclick="openShowModal()" class="btn-gold text-white px-4 py-2 rounded-xl text-sm font-medium">
          <i class="fa-solid fa-plus mr-2"></i>Aggiungi Show
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="card-elevated mb-6 p-4 rounded-2xl">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
        <div>
          <label for="filter-cinema" class="block text-xs font-medium text-brand-on-surface-variant mb-1">Cinema</label>
          <select id="filter-cinema" class="ghost-input w-full px-3 py-1.5 text-sm" title="Filtra per cinema">
            <option value="">Tutti i cinema</option>
          </select>
        </div>
        <div>
          <label for="filter-sala" class="block text-xs font-medium text-brand-on-surface-variant mb-1">Sala</label>
          <select id="filter-sala" class="ghost-input w-full px-3 py-1.5 text-sm" title="Filtra per sala" disabled>
            <option value="">Tutte le sale</option>
          </select>
        </div>
        <div>
          <label for="filter-film" class="block text-xs font-medium text-brand-on-surface-variant mb-1">Film</label>
          <select id="filter-film" class="ghost-input w-full px-3 py-1.5 text-sm" title="Filtra per film">
            <option value="">Tutti i film</option>
          </select>
        </div>
        <div>
          <label for="filter-date" class="block text-xs font-medium text-brand-on-surface-variant mb-1">Data</label>
          <input id="filter-date" type="date" class="ghost-input w-full px-3 py-1.5 text-sm" title="Filtra per data">
        </div>
      </div>
    </div>

    <!-- Shows Table -->
    <div class="card-elevated overflow-x-auto rounded-2xl">
      <table class="min-w-full divide-y divide-brand-outline-variant/10">
        <thead class="bg-brand-surface-container">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Film</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Cinema</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Sala</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Tipologia</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Inizio</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Prezzo</th>
            <th class="px-6 py-3 text-left text-xs font-medium label-caps">Azioni</th>
          </tr>
        </thead>
        <tbody id="shows-table-body" class="divide-y divide-brand-outline-variant/10">
          <tr>
            <td colspan="8" class="px-6 py-4 text-center text-brand-on-surface-variant">Caricamento...</td>
            <td style="display:none"></td>
          </tr>
        </tbody>
      </table>
      <div class="px-6 py-4 border-t border-brand-outline-variant/10 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <p id="pagination-info" class="text-sm text-brand-on-surface-variant">Caricamento...</p>
        <div class="flex items-center gap-2">
          <button id="pagination-first" onclick="goToFirstPage()" type="button" title="Prima pagina" aria-label="Vai alla prima pagina"
            class="px-3 py-1.5 border border-brand-outline-variant rounded-xl text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-angles-left"></i>
          </button>
          <button id="pagination-prev" onclick="goToPrevPage()" type="button" title="Pagina precedente" aria-label="Vai alla pagina precedente"
            class="px-3 py-1.5 border border-brand-outline-variant rounded-xl text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span id="page-indicator" class="text-sm text-brand-on-surface px-2">Pagina 1 di 1</span>
          <button id="pagination-next" onclick="goToNextPage()" type="button" title="Pagina successiva" aria-label="Vai alla pagina successiva"
            class="px-3 py-1.5 border border-brand-outline-variant rounded-xl text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
          <button id="pagination-last" onclick="goToLastPage()" type="button" title="Ultima pagina" aria-label="Vai all'ultima pagina"
            class="px-3 py-1.5 border border-brand-outline-variant rounded-xl text-sm text-brand-on-surface btn-page disabled:opacity-50 disabled:cursor-not-allowed">
            <i class="fa-solid fa-angles-right"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>
  <div id="toast-container" class="fixed bottom-4 right-4 z-50"></div>

  <!-- Show Modal -->
  <div id="show-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-black/70 modal-backdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-brand-surface-container-lowest text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-brand-outline-variant/10">
          <div class="bg-brand-surface-container-lowest px-6 pt-6 pb-4">
            <h3 class="text-lg font-bold text-brand-on-surface" id="modal-title">Aggiungi Show</h3>
            <button type="button" class="absolute top-4 right-4 text-brand-on-surface-variant hover:text-brand-on-surface"
              onclick="closeShowModal()" title="Chiudi" aria-label="Chiudi modal">
              <i class="fa-solid fa-xmark text-xl"></i>
            </button>
          </div>
          <div class="bg-brand-surface-container-lowest px-6 pb-4">
            <form id="show-form" class="space-y-4">
              <input type="hidden" name="id" value="">
              <div>
                <label for="show-cinema" class="block text-sm font-medium text-brand-on-surface mb-1">Cinema</label>
                <select id="show-cinema" name="cinemaId" required class="ghost-input w-full px-4 py-2" title="Seleziona il cinema">
                  <option value="">Seleziona Cinema</option>
                </select>
              </div>
              <div>
                <label for="show-sala" class="block text-sm font-medium text-brand-on-surface mb-1">Sala</label>
                <select id="show-sala" name="salaId" required class="ghost-input w-full px-4 py-2" title="Seleziona la sala" disabled>
                  <option value="">Seleziona prima il cinema</option>
                </select>
              </div>
              <div>
                <label for="show-film" class="block text-sm font-medium text-brand-on-surface mb-1">Film</label>
                <select id="show-film" name="filmId" required class="ghost-input w-full px-4 py-2" title="Seleziona il film">
                  <option value="">Seleziona Film</option>
                </select>
              </div>
              <div>
                <label for="show-start" class="block text-sm font-medium text-brand-on-surface mb-1">Data/Ora Inizio</label>
                <input id="show-start" type="datetime-local" name="startAtUtc" required class="ghost-input w-full px-4 py-2" title="Data e ora di inizio">
              </div>
              <div>
                <label for="show-durata" class="block text-sm font-medium text-brand-on-surface mb-1">Durata (minuti, opzionale)</label>
                <input id="show-durata" type="number" name="durataMinutiSnapshot" min="1" class="ghost-input w-full px-4 py-2" placeholder="Usa durata del film" title="Durata in minuti">
              </div>
              <div>
                <label for="show-prezzo" class="block text-sm font-medium text-brand-on-surface mb-1">Prezzo Base (&euro;, opzionale)</label>
                <input id="show-prezzo" type="number" name="prezzoBase" step="0.01" min="0" class="ghost-input w-full px-4 py-2" placeholder="Prezzo default" title="Prezzo base biglietto">
              </div>
            </form>
          </div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button type="button" class="btn-outline-brand px-4 py-2 rounded-xl text-sm font-medium" onclick="closeShowModal()">Annulla</button>
            <button type="submit" form="show-form" class="btn-gold">Salva</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Delete Modal -->
  <div id="delete-modal" class="fixed inset-0 z-50 hidden">
    <div class="fixed inset-0 bg-black/70 modal-backdrop"></div>
    <div class="fixed inset-0 z-10 overflow-y-auto">
      <div class="flex min-h-full items-end justify-center p-4 text-center sm:items-center sm:p-0">
        <div class="relative transform overflow-hidden rounded-2xl bg-brand-surface-container-lowest text-left shadow-xl transition-all sm:my-8 sm:w-full sm:max-w-md border border-brand-outline-variant/10">
          <div class="bg-brand-surface-container-lowest px-6 pt-6 pb-4">
            <div class="flex items-center gap-4">
              <div class="flex-shrink-0 flex items-center justify-center h-12 w-12 rounded-full bg-brand-error-container">
                <i class="fa-solid fa-triangle-exclamation text-brand-red text-xl"></i>
              </div>
              <div>
                <h3 class="text-lg font-bold text-brand-on-surface">Conferma Eliminazione</h3>
                <p class="text-sm text-brand-on-surface-variant mt-1" id="delete-message">Sei sicuro di voler eliminare questo elemento?</p>
              </div>
            </div>
          </div>
          <div class="bg-brand-surface-container-low px-6 py-4 flex justify-end gap-3">
            <button type="button" class="btn-outline-brand px-4 py-2 rounded-xl text-sm font-medium" onclick="closeDeleteModal()">Annulla</button>
            <button type="button" class="px-4 py-2 bg-red-600 text-white rounded-xl text-sm font-medium hover:bg-red-700" id="confirm-delete-btn">Elimina</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/admin-shell.js"></script>
  <script src="/js/form-handlers.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/pages/shows.js"></script>
  <script>
    function closeShowModal() { document.getElementById('show-modal').classList.add('hidden'); }
    function closeDeleteModal() { document.getElementById('delete-modal').classList.add('hidden'); }
  </script>
</body>

</html>
