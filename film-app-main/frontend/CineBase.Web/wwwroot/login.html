<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCurtain â€” Login</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md animate-fade-in">
      <!-- Logo -->
      <div class="text-center mb-8">
        <a href="/index.html" class="inline-flex items-center gap-2.5 group">
          <img src="/assets/images/logo-icon.png" alt="RedCurtain" class="h-10 w-auto" loading="lazy">
          <span class="text-2xl font-bold tracking-tight text-brand-on-surface group-hover:text-brand-red-light transition-colors">RedCurtain</span>
        </a>
      </div>

      <!-- Login Card -->
      <div class="card-elevated p-8 rounded-2xl">
        <div class="text-center mb-7">
          <h1 class="text-2xl font-bold text-brand-on-surface mb-1">Bentornato</h1>
          <p class="text-brand-on-surface-variant text-sm">Accedi per continuare</p>
        </div>

        <!-- Error Alert -->
        <div id="error-alert"
          class="hidden bg-brand-error-container border border-brand-error/30 text-brand-error px-4 py-3 rounded-xl mb-5 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-message"></span>
        </div>

        <!-- Expired Alert -->
        <div id="expired-alert"
          class="hidden bg-brand-gold-dark/10 border border-brand-gold/30 text-brand-gold px-4 py-3 rounded-xl mb-5 text-sm">
          <i class="fa-solid fa-clock mr-2"></i>
          <span>La tua sessione e scaduta. Effettua il login per continuare.</span>
        </div>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4">
          <div>
            <label for="email" class="text-sm font-medium text-brand-on-surface mb-2 block">Email</label>
            <input type="email" id="email" name="email" class="ghost-input w-full px-4 py-3 rounded-xl"
              placeholder="nome@esempio.com" required autocomplete="email">
          </div>

          <div>
            <label for="password" class="text-sm font-medium text-brand-on-surface mb-2 block">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" class="ghost-input w-full px-4 py-3 pr-12 rounded-xl"
                placeholder="Inserisci la password" required autocomplete="current-password">
              <button type="button" id="toggle-password" title="Mostra o nascondi password"
                aria-label="Mostra o nascondi password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant hover:text-brand-red-light transition-colors">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="btn-gold w-full py-3.5 text-base font-semibold rounded-xl mt-2">
            <span id="btn-text">Accedi</span>
            <span id="btn-loader" class="hidden">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>Accesso in corso...
            </span>
          </button>

          <div class="text-right">
            <a href="/recupera-password.html" class="text-brand-red-light hover:text-brand-red text-sm transition-colors">
              Password dimenticata?
            </a>
          </div>
        </form>

        <div id="social-buttons" class="space-y-3 mt-4">
          <button onclick="socialLogin('google')" class="w-full py-3 px-4 rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 text-brand-on-surface hover:border-brand-outline hover:bg-brand-surface-container-high flex items-center justify-center gap-3 text-sm font-medium transition-all duration-200">
            <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continua con Google
          </button>
          <button onclick="socialLogin('microsoft')" class="w-full py-3 px-4 rounded-xl bg-brand-surface-container border border-brand-outline-variant/30 text-brand-on-surface hover:border-brand-outline hover:bg-brand-surface-container-high flex items-center justify-center gap-3 text-sm font-medium transition-all duration-200">
            <svg class="w-5 h-5" viewBox="0 0 23 23"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="12" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="12" width="9" height="9" fill="#00a4ef"/><rect x="12" y="12" width="9" height="9" fill="#ffb900"/></svg>
            Continua con Microsoft
          </button>
        </div>

        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-brand-outline-variant/30"></div>
          <span class="text-brand-on-surface-variant text-sm">oppure</span>
          <div class="flex-1 h-px bg-brand-outline-variant/30"></div>
        </div>

        <div class="text-center">
          <p class="text-brand-on-surface-variant text-sm">
            Non hai un account?
            <a href="/registrazione.html" class="text-brand-red-light hover:text-brand-red font-medium ml-1 transition-colors">
              Registrati
            </a>
          </p>
        </div>
      </div>

      <div class="text-center mt-6">
        <a href="/index.html"
          class="text-brand-on-surface-variant hover:text-brand-red-light text-sm inline-flex items-center gap-1 transition-colors">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          Torna alla home
        </a>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/pages/login.js"></script>
</body>

</html>
