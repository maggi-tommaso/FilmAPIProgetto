<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Registrazione</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="/index.html" class="text-3xl font-bold text-brand-gold tracking-tight inline-flex items-center gap-2">
          <span class="text-4xl">🎬</span>
          CineBase
        </a>
      </div>

      <div class="glass-panel card-elevated p-8 rounded-2xl">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-brand-on-surface mb-2">Crea un account</h1>
          <p class="text-brand-on-surface-variant text-sm">Registrati per acquistare biglietti e gestire i tuoi dati</p>
        </div>

        <div id="error-alert"
          class="hidden bg-brand-error-container border border-brand-error/30 text-brand-error px-4 py-3 rounded-xl mb-6 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-message"></span>
        </div>

        <div id="success-alert"
          class="hidden bg-green-900/20 border border-green-500/30 text-green-400 px-4 py-3 rounded-xl mb-6 text-sm">
          <i class="fa-solid fa-check-circle mr-2"></i>
          <span>Account creato con successo! Reindirizzamento...</span>
        </div>

        <form id="register-form" class="space-y-4">
          <div>
            <label for="nome" class="block text-sm font-medium text-brand-on-surface mb-2">Nome</label>
            <input type="text" id="nome" name="nome" class="ghost-input w-full px-4 py-3 rounded-xl" placeholder="Mario"
              required autocomplete="given-name">
          </div>

          <div>
            <label for="cognome" class="block text-sm font-medium text-brand-on-surface mb-2">Cognome</label>
            <input type="text" id="cognome" name="cognome" class="ghost-input w-full px-4 py-3 rounded-xl"
              placeholder="Rossi" required autocomplete="family-name">
          </div>

          <div>
            <label for="email" class="block text-sm font-medium text-brand-on-surface mb-2">Email</label>
            <input type="email" id="email" name="email" class="ghost-input w-full px-4 py-3 rounded-xl"
              placeholder="nome@esempio.com" required autocomplete="email">
          </div>

          <div>
            <label for="telefono" class="block text-sm font-medium text-brand-on-surface mb-2">Telefono <span
                class="text-brand-on-surface-variant">(opzionale)</span></label>
            <input type="tel" id="telefono" name="telefono" class="ghost-input w-full px-4 py-3 rounded-xl"
              placeholder="+39 333 1234567" autocomplete="tel">
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-brand-on-surface mb-2">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" class="ghost-input w-full px-4 py-3 pr-12 rounded-xl"
                placeholder="Minimo 8 caratteri" required autocomplete="new-password">
              <button type="button" id="toggle-password" title="Mostra o nascondi password"
                aria-label="Mostra o nascondi password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant hover:text-brand-on-surface">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div id="password-strength" class="mt-2">
              <div class="h-1 bg-brand-surface-container rounded-full overflow-hidden">
                <div id="strength-bar" class="h-full w-0 bg-brand-error transition-all"></div>
              </div>
              <p id="strength-text" class="text-xs text-brand-on-surface-variant mt-1"></p>
            </div>
          </div>

          <div>
            <label for="confirm-password" class="block text-sm font-medium text-brand-on-surface mb-2">Conferma
              Password</label>
            <div class="relative">
              <input type="password" id="confirm-password" name="confirmPassword"
                class="ghost-input w-full px-4 py-3 pr-12 rounded-xl" placeholder="Ripeti la password" required
                autocomplete="new-password">
              <button type="button" id="toggle-confirm-password" title="Mostra o nascondi conferma password"
                aria-label="Mostra o nascondi conferma password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant hover:text-brand-on-surface">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <p id="confirm-error" class="hidden text-brand-error text-xs mt-1"></p>
          </div>

          <button type="submit" id="submit-btn" class="btn-gold w-full py-3 text-base font-semibold rounded-xl mt-6">
            <span id="btn-text">Crea Account</span>
            <span id="btn-loader" class="hidden">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>Registrazione in corso...
            </span>
          </button>
        </form>

        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-brand-outline-variant/30"></div>
          <span class="text-brand-on-surface-variant text-sm">oppure</span>
          <div class="flex-1 h-px bg-brand-outline-variant/30"></div>
        </div>

        <div class="text-center">
          <p class="text-brand-on-surface-variant text-sm">
            Hai già un account?
            <a href="/login.html" class="text-brand-gold hover:text-brand-gold-light font-medium ml-1">Accedi</a>
          </p>
        </div>
      </div>

      <div class="text-center mt-6">
        <a href="/index.html"
          class="text-brand-on-surface-variant hover:text-brand-gold text-sm inline-flex items-center gap-1">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          Torna alla home
        </a>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/pages/registrazione.js"></script>
</body>

</html>
