<!DOCTYPE html>
<html lang="it-IT">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCurtain â€” Registrazione</title>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script src="/js/tailwind-config.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
  <script src="/js/route-guard.js"></script>
</head>

<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>

  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md animate-fade-in">
      <div class="text-center mb-8">
        <a href="/index.html" class="inline-flex items-center gap-2.5 group">
          <img src="/assets/images/logo-icon.png" alt="RedCurtain" class="h-10 w-auto" loading="lazy">
          <span class="text-2xl font-bold tracking-tight text-brand-on-surface group-hover:text-brand-red-light transition-colors">RedCurtain</span>
        </a>
      </div>

      <div class="card-elevated p-8 rounded-2xl">
        <div class="text-center mb-7">
          <h1 class="text-2xl font-bold text-brand-on-surface mb-1">Crea un account</h1>
          <p class="text-brand-on-surface-variant text-sm">Registrati per acquistare biglietti e gestire i tuoi dati</p>
        </div>

        <div id="error-alert"
          class="hidden bg-brand-error-container border border-brand-error/30 text-brand-error px-4 py-3 rounded-xl mb-5 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i>
          <span id="error-message"></span>
        </div>

        <div id="success-alert"
          class="hidden bg-brand-emerald/10 border border-brand-emerald/30 text-brand-emerald px-4 py-3 rounded-xl mb-5 text-sm">
          <i class="fa-solid fa-check-circle mr-2"></i>
          <span>Account creato con successo! Reindirizzamento...</span>
        </div>

        <form id="register-form" class="space-y-4">
          <div>
            <label for="nome" class="text-sm font-medium text-brand-on-surface mb-2 block">Nome</label>
            <input type="text" id="nome" name="nome" class="ghost-input w-full px-4 py-3 rounded-xl" placeholder="Mario"
              required autocomplete="given-name">
          </div>

          <div>
            <label for="cognome" class="text-sm font-medium text-brand-on-surface mb-2 block">Cognome</label>
            <input type="text" id="cognome" name="cognome" class="ghost-input w-full px-4 py-3 rounded-xl"
              placeholder="Rossi" required autocomplete="family-name">
          </div>

          <div>
            <label for="email" class="text-sm font-medium text-brand-on-surface mb-2 block">Email</label>
            <input type="email" id="email" name="email" class="ghost-input w-full px-4 py-3 rounded-xl"
              placeholder="nome@esempio.com" required autocomplete="email">
          </div>

          <div>
            <label for="telefono" class="text-sm font-medium text-brand-on-surface mb-2 block">Telefono <span
                class="text-brand-on-surface-variant font-normal">(opzionale)</span></label>
            <input type="tel" id="telefono" name="telefono" class="ghost-input w-full px-4 py-3 rounded-xl"
              placeholder="+39 333 1234567" autocomplete="tel">
          </div>

          <div>
            <label for="cinema-preferito" class="text-sm font-medium text-brand-on-surface mb-2 block">Cinema preferito <span
                class="text-brand-on-surface-variant font-normal">(opzionale)</span></label>
            <select id="cinema-preferito" name="cinema-preferito" class="ghost-input w-full px-4 py-3 rounded-xl">
              <option value="">Nessuna preferenza</option>
            </select>
            <p id="cinema-loading" class="text-xs text-brand-on-surface-variant mt-1">Caricamento cinema...</p>
          </div>

          <div>
            <label for="password" class="text-sm font-medium text-brand-on-surface mb-2 block">Password</label>
            <div class="relative">
              <input type="password" id="password" name="password" class="ghost-input w-full px-4 py-3 pr-12 rounded-xl"
                placeholder="Minimo 8 caratteri" required autocomplete="new-password">
              <button type="button" id="toggle-password" title="Mostra o nascondi password"
                aria-label="Mostra o nascondi password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant hover:text-brand-red-light transition-colors">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <div id="password-strength" class="mt-2">
              <div class="h-1.5 bg-brand-surface-container rounded-full overflow-hidden">
                <div id="strength-bar" class="h-full w-0 bg-brand-error transition-all duration-300 rounded-full"></div>
              </div>
              <p id="strength-text" class="text-xs text-brand-on-surface-variant mt-1.5"></p>
            </div>
          </div>

          <div>
            <label for="confirm-password" class="text-sm font-medium text-brand-on-surface mb-2 block">Conferma
              Password</label>
            <div class="relative">
              <input type="password" id="confirm-password" name="confirmPassword"
                class="ghost-input w-full px-4 py-3 pr-12 rounded-xl" placeholder="Ripeti la password" required
                autocomplete="new-password">
              <button type="button" id="toggle-confirm-password" title="Mostra o nascondi conferma password"
                aria-label="Mostra o nascondi conferma password"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-brand-on-surface-variant hover:text-brand-red-light transition-colors">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <p id="confirm-error" class="hidden text-brand-error text-xs mt-1.5"></p>
          </div>

          <div class="space-y-3 pt-2 border-t border-brand-outline-variant/20">
            <label class="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" id="accept-privacy" name="acceptPrivacy" required
                class="mt-0.5 h-4 w-4 rounded border-brand-outline-variant/40 text-brand-gold focus:ring-brand-gold/30">
              <span class="text-sm text-brand-on-surface-variant">
                Ho letto e accetto la <a href="/privacy.html" target="_blank" class="text-brand-gold hover:underline">Privacy Policy</a>
              </span>
            </label>
            <label class="flex items-start gap-3 cursor-pointer">
              <input type="checkbox" id="accept-terms" name="acceptTerms" required
                class="mt-0.5 h-4 w-4 rounded border-brand-outline-variant/40 text-brand-gold focus:ring-brand-gold/30">
              <span class="text-sm text-brand-on-surface-variant">
                Ho letto e accetto i <a href="/termini.html" target="_blank" class="text-brand-gold hover:underline">Termini di Servizio</a>
              </span>
            </label>
            <p id="consent-error" class="hidden text-brand-error text-xs"></p>
          </div>

          <button type="submit" id="submit-btn" class="btn-gold w-full py-3.5 text-base font-semibold rounded-xl mt-2">
            <span id="btn-text">Crea Account</span>
            <span id="btn-loader" class="hidden">
              <i class="fa-solid fa-spinner fa-spin mr-2"></i>Registrazione in corso...
            </span>
          </button>
        </form>

        <div class="flex items-center gap-4 my-6">
          <div class="flex-1 h-px bg-brand-outline-variant/30"></div>
          <span class="text-brand-on-surface-variant text-sm">oppure</span>
          <div class="flex-1 h-px bg-brand-outline-variant/30"></div>
        </div>

        <div class="text-center">
          <p class="text-brand-on-surface-variant text-sm">
            Hai gia un account?
            <a href="/login.html" class="text-brand-red-light hover:text-brand-red font-medium ml-1 transition-colors">Accedi</a>
          </p>
        </div>
      </div>

      <div class="text-center mt-6">
        <a href="/index.html"
          class="text-brand-on-surface-variant hover:text-brand-red-light text-sm inline-flex items-center gap-1 transition-colors">
          <i class="fa-solid fa-arrow-left text-xs"></i>
          Torna alla home
        </a>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script src="/js/pages/registrazione.js"></script>
</body>

</html>
