<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBase - Recupera Password</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="/js/tailwind-config.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="/css/styles.css" rel="stylesheet">
  <script src="/js/theme.js"></script>
</head>
<body class="bg-brand-surface text-brand-on-surface font-sans min-h-screen flex flex-col">
  <div id="navbar-container"></div>
  <div class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <a href="/index.html" class="text-3xl font-bold text-brand-gold tracking-tight inline-flex items-center gap-2">
          <span class="text-4xl">🎬</span>CineBase
        </a>
      </div>
      <div class="glass-panel card-elevated p-8 rounded-2xl">
        <div class="text-center mb-6">
          <h1 class="text-2xl font-bold text-brand-on-surface mb-2">Password dimenticata?</h1>
          <p class="text-brand-on-surface-variant text-sm">Inserisci la tua email e ti invieremo un link per reimpostare la password.</p>
        </div>
        <div id="success-alert" class="hidden bg-green-900/20 border border-green-500/30 text-green-400 px-4 py-3 rounded-xl mb-6 text-sm">
          <i class="fa-solid fa-check-circle mr-2"></i>
          <span>Se l'email è registrata, riceverai un link per reimpostare la password. Controlla la tua casella di posta.</span>
        </div>
        <div id="error-alert" class="hidden bg-brand-error-container border border-brand-error/30 text-brand-error px-4 py-3 rounded-xl mb-6 text-sm">
          <i class="fa-solid fa-circle-exclamation mr-2"></i><span id="error-message"></span>
        </div>
        <form id="forgot-form" class="space-y-5">
          <div>
            <label for="email" class="block text-sm font-medium text-brand-on-surface mb-2">Email</label>
            <input type="email" id="email" name="email" class="ghost-input w-full px-4 py-3 rounded-xl" placeholder="nome@esempio.com" required autocomplete="email">
          </div>
          <button type="submit" id="submit-btn" class="btn-gold w-full py-3 text-base font-semibold rounded-xl">
            <span id="btn-text">Invia link di recupero</span>
            <span id="btn-loader" class="hidden"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Invio in corso...</span>
          </button>
        </form>
        <div class="text-center mt-6">
          <a href="/login.html" class="text-brand-on-surface-variant hover:text-brand-gold text-sm inline-flex items-center gap-1">
            <i class="fa-solid fa-arrow-left text-xs"></i>Torna al login
          </a>
        </div>
      </div>
    </div>
  </div>
  <div id="footer-container"></div>
  <script src="/js/api.js"></script>
  <script src="/js/template-loader.js"></script>
  <script src="/js/navbar.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('submit-btn');
      const btnText = document.getElementById('btn-text');
      const btnLoader = document.getElementById('btn-loader');
      const successAlert = document.getElementById('success-alert');
      const errorAlert = document.getElementById('error-alert');
      const errorMessage = document.getElementById('error-message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        btnText.classList.add('hidden');
        btnLoader.classList.remove('hidden');
        submitBtn.disabled = true;
        successAlert.classList.add('hidden');
        errorAlert.classList.add('hidden');

        try {
          await fetch(`${API_BASE_URL}/auth/forgot-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
          });
          successAlert.classList.remove('hidden');
          form.classList.add('hidden');
        } catch {
          errorMessage.textContent = 'Impossibile connettersi al server.';
          errorAlert.classList.remove('hidden');
        } finally {
          btnText.classList.remove('hidden');
          btnLoader.classList.add('hidden');
          submitBtn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
