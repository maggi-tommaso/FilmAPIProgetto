<!DOCTYPE html>
<html lang="it-IT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RedCurtain â€” Accesso in corso...</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body{margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0d0d0d;color:#e0e0e0;font-family:Inter,sans-serif}
    .spinner{font-size:3rem;color:#d4a017;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div style="text-align:center">
    <i class="fa-solid fa-spinner spinner"></i>
    <p style="margin-top:1rem">Completamento accesso in corso...</p>
    <p id="error-msg" style="color:#ef4444;display:none"></p>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (async function() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      if (!code) { window.location.href = '/login.html'; return; }

      try {
        const deviceId = Auth.getOrCreateDeviceId();
        const r = await fetch(`${API_BASE_URL}/auth/external/exchange`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code, deviceId })
        });
        if (!r.ok) throw new Error('Accesso fallito.');
        const data = await r.json();
        Auth.saveTokens(data.accessToken, data.refreshToken);
        Auth.saveUser(data.user);
        const redirect = params.get('redirect');
        window.location.href = redirect && redirect.startsWith('/') && !redirect.startsWith('//')
          ? decodeURIComponent(redirect)
          : '/index.html';
      } catch(e) {
        document.getElementById('error-msg').textContent = 'Errore durante l\'accesso. Torna al login.';
        document.getElementById('error-msg').style.display = 'block';
        setTimeout(() => { window.location.href = '/login.html'; }, 3000);
      }
    })();
  </script>
</body>
</html>
